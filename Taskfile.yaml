version: "3"

vars:
  VENV: .venv
  PY: .venv/bin/python

tasks:
  default:
    cmds: [task --list]
    silent: true

  venv:
    desc: "Create the virtual environment"
    status: ["test -d {{.VENV}}"]
    cmds:
      - python3 -m venv {{.VENV}}

  venv-load:
    desc: "Load the virtual environment"
    status: ["test -d {{.VENV}}"]
    cmds:
      - source {{.VENV}}/bin/activate

  install:
    desc: "Install the package and dev dependencies (editable)"
    deps: [venv]
    cmds:
      - "{{.PY}} -m pip install --upgrade pip"
      - "{{.PY}} -m pip install -e '.[dev]'"

  fmt:
    desc: "Format the code"
    cmds:
      - "{{.PY}} -m ruff format src tests"
      - "{{.PY}} -m ruff check --fix src tests"

  lint:
    desc: "Lint without modifying files"
    cmds:
      - "{{.PY}} -m ruff format --check src tests"
      - "{{.PY}} -m ruff check src tests"

  types:
    desc: "Static type check"
    cmds:
      - "{{.PY}} -m mypy"

  test:
    desc: "Run the test suite"
    cmds:
      - "{{.PY}} -m pytest"

  cov:
    desc: "Run the test suite with a coverage report"
    cmds:
      - "{{.PY}} -m pytest --cov=tov_solver --cov-report=term-missing"

  check:
    desc: "Everything CI runs"
    cmds:
      - task: lint
      - task: types
      - task: test

  play:
    desc: "Run the interactive solver"
    cmds:
      - "{{.PY}} playground/main.py"
