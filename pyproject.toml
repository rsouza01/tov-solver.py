[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tov-solver"
version = "0.0.1"
description = "Hybrid neutron star structure: equations of state and TOV integration"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rodrigo Souza" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tov_solver"]


# --- test ------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# Numerical code should never silently swallow a warning.
filterwarnings = ["error"]


# --- lint / format ---------------------------------------------------------

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "RUF",      # ruff-specific
]
ignore = [
    "E741",  # ambiguous variable names: l, I, O are legitimate physics symbols
    "N806",  # non-lowercase locals: P, M, R, B are the names in the equations
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "N802",    # test names mirror physics notation
    "SIM300",  # `x == pytest.approx(y)` is the idiom; ruff misreads UPPER_CASE as a literal
]
 
 
 # --- typing ----------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
packages = ["tov_solver"]
mypy_path = "src"
strict = true
# scipy ships incomplete stubs; don't fail the build over them.
[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true
